<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MatchTracker - Voetbal & Hockey</title>
    <meta name="theme-color" content="#020617">
    <script type="module" src="/src/main.js"></script>
    
    <!-- Google AdSense Script (Vervang ca-pub-XXXXXXXXXXXXXXXX door jouw eigen AdSense Publisher ID) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex justify-center items-start sm:py-4">

    <!-- START ADVERTENTIE OVERLAY (10 seconden) -->
    <div id="start-ad-overlay" class="fixed inset-0 bg-slate-950/95 z-[300] flex flex-col items-center justify-center p-4">
        <div class="mb-2 text-slate-400 text-xs font-bold uppercase tracking-widest">Sponsorbericht</div>
        <div class="bg-slate-900 border border-slate-700 w-full max-w-sm h-[280px] flex items-center justify-center rounded-2xl overflow-hidden mb-6 relative shadow-2xl">
            <!-- AdSense Start Ad Unit (Vervang data-ad-slot door jouw AdMob/AdSense blok ID) -->
            <ins class="adsbygoogle"
                 style="display:inline-block;width:300px;height:250px"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="YYYYYYYYYY"></ins>
        </div>
        <button id="close-ad-btn" disabled class="w-full max-w-xs py-3.5 rounded-xl bg-slate-800 text-slate-500 font-bold border border-slate-700 shadow-lg transition-all duration-300 disabled:opacity-80">
            Sluiten over 10s
        </button>
    </div>

    <!-- App Container -->
    <div id="app-shell" class="w-full max-w-md bg-slate-900 min-h-screen sm:min-h-[860px] sm:rounded-[2.5rem] sm:border-[6px] sm:border-slate-800 shadow-2xl flex flex-col justify-between overflow-hidden relative">
        
        <!-- Bovenste App Balk -->
        <header class="shrink-0 bg-slate-800/90 backdrop-blur px-4 py-3 flex flex-wrap gap-2 justify-between items-center border-b border-slate-700/70">
            <div class="flex-1 basis-0 min-w-min flex items-center space-x-2.5">
                <div class="shrink-0 w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <i id="sport-icon" class="fa-solid fa-futbol text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-bold text-sm sm:text-base leading-tight tracking-wide text-white">MatchTracker</h1>
                        <span id="pro-badge" class="hidden text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">PRO</span>
                    </div>
                    <p class="text-[10px] text-slate-400">Scheidsrechter & Score App</p>
                </div>
            </div>
            
            <div class="ml-auto flex items-center space-x-1">
                <button data-action="lock-screen" id="lock-btn" title="Scherm vergrendelen" aria-label="Scherm vergrendelen" class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center transition active:scale-95">
                    <i class="fa-solid fa-lock text-xs"></i>
                </button>
                <button data-action="toggle-sound" id="alert-toggle-btn" title="Geluid & Trillen aan/uit" class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center transition active:scale-95">
                    <i id="alert-toggle-icon" class="fa-solid fa-volume-high text-xs"></i>
                </button>
                <button data-action="open-settings" title="Instellingen" class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center transition active:scale-95">
                    <i class="fa-solid fa-gear text-xs"></i>
                </button>
                <button data-action="toggle-sport" id="sport-btn" class="whitespace-nowrap text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-full font-medium transition flex items-center gap-1.5 border border-slate-600 active:scale-95">
                    <span id="sport-label">Voetbal</span>
                    <i class="fa-solid fa-repeat text-[10px] text-emerald-400"></i>
                </button>
            </div>
        </header>

        <!-- Hoofdinhoud -->
        <main id="main-scroll-area" class="flex-1 p-3.5 flex flex-col gap-3.5 overflow-y-auto min-h-0 pb-4">
            
            <!-- IN-APP AANKOOP BANNER (Tijdelijk visueel gelaten) -->
            <div id="upgrade-banner" class="shrink-0 bg-gradient-to-r from-indigo-900/80 via-blue-900/70 to-slate-800 rounded-2xl px-3.5 py-2.5 border border-indigo-500/40 shadow-md flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-xl bg-amber-400/20 border border-amber-400/40 flex items-center justify-center text-amber-300 flex-shrink-0">
                        <i class="fa-solid fa-crown text-sm"></i>
                    </div>
                    <div class="min-w-0">
                        <div class="text-[11px] text-indigo-200 font-medium leading-tight">Reclamevrij fluiten?</div>
                        <div class="text-xs font-bold text-white truncate"><span>Reclame verwijderen</span><span id="upgrade-price" class="hidden"></span></div>
                    </div>
                </div>
                <button data-action="open-billing" class="bg-white hover:bg-indigo-50 active:scale-95 text-indigo-950 font-extrabold text-xs px-3 py-1.5 rounded-xl shadow transition flex-shrink-0">
                    Bekijk
                </button>
            </div>

            <!-- 1. TIJD & HELFT/KWART SECTIE -->
            <section id="time-section" class="shrink-0 bg-slate-800/90 rounded-2xl p-3.5 border border-slate-700/80 shadow-lg relative overflow-hidden">
                <div id="timer-glow" class="absolute inset-0 bg-emerald-500/5 opacity-0 transition-opacity duration-500 pointer-events-none"></div>

                <div class="flex flex-wrap justify-between items-center mb-2.5 gap-2">
                    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700/80">
                        <button id="mode-halves-btn" data-action="set-mode" data-arg="2" class="py-1 px-2.5 rounded-lg text-xs font-bold bg-slate-700 text-emerald-400 shadow transition">
                            2 Helften
                        </button>
                        <button id="mode-quarters-btn" data-action="set-mode" data-arg="4" class="py-1 px-2.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">
                            4 Kwarten
                        </button>
                    </div>
                    <div class="flex items-center bg-slate-900 px-2.5 py-1 rounded-xl border border-slate-700/80">
                        <label id="duration-label" for="half-duration" class="text-xs text-slate-400 mr-1.5 font-medium">Min/helft:</label>
                        <input type="number" id="half-duration" value="45" min="0.5" max="120" step="0.5" class="w-14 bg-slate-800 text-white font-bold text-center text-sm rounded border border-slate-600 focus:outline-none focus:border-emerald-500 py-0.5">
                    </div>
                </div>

                <div id="period-buttons-container" class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl border border-slate-700/80 mb-2 gap-1"></div>
                <div id="period-times-summary" class="mb-2.5 bg-slate-900/70 rounded-xl px-3 py-2 border border-slate-800/90"></div>

                <div id="clock-box" class="text-center my-1.5 py-2 bg-slate-950/90 rounded-xl border border-slate-800 relative transition-all duration-300">
                    <div id="time-display" class="font-digital text-5xl sm:text-6xl font-bold tracking-wider text-white drop-shadow">00:00</div>
                    <div class="flex justify-center items-center gap-2 mt-1">
                        <span id="status-badge" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                        <span id="time-status-text" class="text-[11px] uppercase tracking-widest text-slate-400 font-semibold">Gepauzeerd (Doel: 45:00)</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-2.5">
                    <button id="btn-start" data-action="start" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-1.5 text-sm transition">
                        <i class="fa-solid fa-play text-xs"></i> Start
                    </button>
                    <button id="btn-pause" data-action="pause" class="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-amber-950/50 flex items-center justify-center gap-1.5 text-sm transition opacity-50 cursor-not-allowed" disabled>
                        <i class="fa-solid fa-pause text-xs"></i> Pauze
                    </button>
                    <button data-action="reset-time" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 font-semibold py-2.5 rounded-xl border border-slate-600 flex items-center justify-center gap-1.5 text-xs sm:text-sm transition">
                        <i class="fa-solid fa-rotate-left text-xs"></i> Reset Tijd
                    </button>
                </div>

                <div class="mt-2.5 pt-2.5 border-t border-slate-700/70">
                    <div id="break-idle-bar" class="flex items-center justify-between gap-2">
                        <button id="btn-start-break" data-action="period-end" class="w-full bg-indigo-600/25 hover:bg-indigo-600/40 active:scale-95 text-indigo-300 border border-indigo-500/40 font-semibold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-sm">
                            <i id="btn-start-break-icon" class="fa-solid fa-mug-hot text-indigo-400"></i>
                            <span id="btn-start-break-label">Start Rust (na 1e Helft)</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- 2. SCOREBORD & TEAMS SECTIE -->
            <section id="score-section" class="shrink-0 bg-slate-800/90 rounded-2xl p-3.5 border border-slate-700/80 shadow-lg">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400"><i class="fa-solid fa-trophy text-emerald-400 mr-1.5"></i>Scorebord</span>
                </div>
                <div class="flex justify-between items-center bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-800 mb-2.5">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-user-pen text-emerald-400 text-xs"></i>
                        <span class="text-xs text-slate-300 font-medium">Doelpuntenmaker vastleggen</span>
                    </div>
                    <button type="button" id="track-scorers-switch" data-action="toggle-scorers" class="w-10 h-5 bg-slate-700 rounded-full relative transition-colors duration-200 p-0.5 flex items-center border border-slate-600">
                        <div id="track-scorers-knob" class="w-4 h-4 bg-slate-300 rounded-full shadow-md transform transition-transform duration-200 translate-x-0"></div>
                    </button>
                </div>

                <div class="grid grid-cols-11 items-center gap-2">
                    <!-- TEAM THUIS -->
                    <div class="col-span-5 flex flex-col items-center bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                        <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold mb-1">Thuis</span>
                        <input type="text" id="team1-name" value="Thuis" class="w-full bg-slate-800/90 text-center font-bold text-white text-sm rounded-lg px-2 py-1 border border-slate-700 focus:border-emerald-500 mb-2 truncate">
                        <button data-action="score" data-arg="1,1" class="w-full py-1.5 bg-slate-800 hover:bg-emerald-600/30 text-emerald-400 rounded-t-xl border border-slate-700 flex justify-center items-center active:scale-95"><i class="fa-solid fa-chevron-up"></i></button>
                        <div id="score-team1" class="font-digital text-4xl sm:text-5xl font-bold text-white py-1.5 w-full text-center bg-slate-950 border-x border-slate-700">0</div>
                        <button data-action="score" data-arg="1,-1" class="w-full py-1.5 bg-slate-800 hover:bg-rose-600/30 text-slate-400 hover:text-rose-400 rounded-b-xl border border-slate-700 flex justify-center items-center active:scale-95"><i class="fa-solid fa-chevron-down"></i></button>
                    </div>

                    <div class="col-span-1 flex flex-col items-center justify-center"><span class="font-digital text-3xl font-bold text-slate-500">:</span></div>

                    <!-- TEAM UIT -->
                    <div class="col-span-5 flex flex-col items-center bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                        <span class="text-[10px] uppercase tracking-wider text-sky-400 font-bold mb-1">Uit</span>
                        <input type="text" id="team2-name" value="Uit" class="w-full bg-slate-800/90 text-center font-bold text-white text-sm rounded-lg px-2 py-1 border border-slate-700 focus:border-sky-500 mb-2 truncate">
                        <button data-action="score" data-arg="2,1" class="w-full py-1.5 bg-slate-800 hover:bg-sky-600/30 text-sky-400 rounded-t-xl border border-slate-700 flex justify-center items-center active:scale-95"><i class="fa-solid fa-chevron-up"></i></button>
                        <div id="score-team2" class="font-digital text-4xl sm:text-5xl font-bold text-white py-1.5 w-full text-center bg-slate-950 border-x border-slate-700">0</div>
                        <button data-action="score" data-arg="2,-1" class="w-full py-1.5 bg-slate-800 hover:bg-rose-600/30 text-slate-400 hover:text-rose-400 rounded-b-xl border border-slate-700 flex justify-center items-center active:scale-95"><i class="fa-solid fa-chevron-down"></i></button>
                    </div>
                </div>
            </section>

            <!-- 3. WEDSTRIJDBOEK -->
            <section id="log-section" class="shrink-0 grow bg-slate-800/90 rounded-2xl p-3.5 border border-slate-700/80 shadow-lg flex flex-col">
                <div class="flex justify-between items-center mb-2.5">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-white">Wedstrijdboek</span>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <button data-action="open-card" data-arg="Geel" class="bg-yellow-500/15 border border-yellow-500/40 text-yellow-300 font-bold py-2 px-2 rounded-xl flex items-center justify-center gap-1.5 text-xs active:scale-95">+ Geel</button>
                    <button data-action="open-card" data-arg="Rood" class="bg-rose-500/15 border border-rose-500/40 text-rose-300 font-bold py-2 px-2 rounded-xl flex items-center justify-center gap-1.5 text-xs active:scale-95">+ Rood</button>
                    <button data-action="open-sub" class="bg-sky-500/15 border border-sky-500/40 text-sky-300 font-bold py-2 px-2 rounded-xl flex items-center justify-center gap-1.5 text-xs active:scale-95">+ Wissel</button>
                </div>
                <div id="cards-list" class="grow bg-slate-950/90 rounded-xl p-3 border border-slate-800/90 overflow-y-auto max-h-64 shadow-inner">
                    <p class="text-xs text-slate-500 text-center py-6 italic">Nog geen gebeurtenissen.<br>Druk op Start.</p>
                </div>
            </section>
        </main>

        <!-- VASTE ADVERTENTIE BANNER ONDERAAN -->
        <div id="ad-banner-bottom" class="shrink-0 w-full bg-slate-900 border-t border-slate-700 flex justify-center items-center h-[60px] overflow-hidden z-40">
            <!-- AdSense Banner Ad Unit (Vervang data-ad-slot door jouw AdMob/AdSense blok ID) -->
            <ins class="adsbygoogle"
                 style="display:inline-block;width:320px;height:50px"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="ZZZZZZZZZZ"></ins>
        </div>

    </div>

    <!-- SCRIPT VOOR ADSENSE INITIALISATIE & START AD TIMER -->
    <script>
        // Initieer AdSense blokken (1x Start Ad, 1x Banner)
        try {
            (adsbygoogle = window.adsbygoogle || []).push({});
            (adsbygoogle = window.adsbygoogle || []).push({});
        } catch (e) {
            console.error("AdSense fout:", e);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Controleer of gebruiker reclame heeft afgekocht (wordt later via Mollie gekoppeld)
            const isAdFree = localStorage.getItem('matchtracker_pro') === 'true';
            
            const startAdOverlay = document.getElementById('start-ad-overlay');
            const adBannerBottom = document.getElementById('ad-banner-bottom');
            const closeAdBtn = document.getElementById('close-ad-btn');

            if (isAdFree) {
                // Verberg reclames direct
                if (startAdOverlay) startAdOverlay.style.display = 'none';
                if (adBannerBottom) adBannerBottom.style.display = 'none';
            } else {
                // Start de 10-seconden teller voor de Start Advertentie
                let adCountdown = 10;
                
                const adTimer = setInterval(() => {
                    adCountdown--;
                    if (adCountdown > 0) {
                        closeAdBtn.innerText = `Sluiten over ${adCountdown}s`;
                    } else {
                        clearInterval(adTimer);
                        closeAdBtn.disabled = false;
                        closeAdBtn.classList.remove('bg-slate-800', 'text-slate-500', 'border-slate-700');
                        closeAdBtn.classList.add('bg-rose-600', 'text-white', 'hover:bg-rose-500', 'border-rose-500', 'active:scale-95');
                        closeAdBtn.innerText = "Sluit Advertentie";
                    }
                }, 1000);

                closeAdBtn.addEventListener('click', () => {
                    startAdOverlay.style.opacity = '0';
                    setTimeout(() => { startAdOverlay.style.display = 'none'; }, 300);
                });
            }
        });
    </script>

</body>
</html>
